project_name: "isekai-world-war-fantasy"
language_servers: ["gdscript"]
encoding: "utf-8"
language_backend: "LSP"
agent_interface: "tools"
ignore_all_files_in_gitignore: true
ls_workspace_folders: ["client"]
ls_additional_workspace_folders: []
ignored_paths:
  - ".codex-local/**"
  - "client/.godot/**"
  - "**/node_modules/**"
  - "**/target/**"
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
excluded_apis: []
included_apis: []
initial_prompt: >-
  Work surgically. Prefer symbol/reference navigation over broad file reads. Preserve
  the existing Gameplay -> Foundation -> Core architecture, read the active Mission
  Contract for non-trivial work, and do not treat technical scaffolding as completion
  of a player-facing Macro Version. Use the Godot runtime/editor MCP for engine-aware
  validation and deterministic tests for facts that do not require human judgement.
