# Project-level Codex configuration.
# Loaded only when this repository is trusted by the local/remote Codex host.
#
# Default autonomy profile for this dedicated project workspace:
# - keep the agent sandboxed to the repository/workspace;
# - let it handle routine edits/tests without stopping BK every few seconds;
# - send eligible approval requests to Codex auto-review instead of the user;
# - allow network access from inside the workspace sandbox for Git/MCP/dev tooling.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[sandbox_workspace_write]
network_access = true

# Semantic code navigation/editing. Serena is installed by the project bootstrap
# and exposed on a stable /usr/local/bin launcher for Cloud task lifecycles.
[mcp_servers.serena]
enabled = true
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

# Lightweight GDScript diagnostics + DAP console. The binary is installed during
# environment preparation; do not rely on npx/network during the task lifecycle.
[mcp_servers.godot_diagnostics]
enabled = true
command = "minimal-godot-mcp"
args = []
env = { GODOT_WORKSPACE_PATH = "client", GODOT_LSP_PORT = "6008", GODOT_DAP_PORT = "6006" }
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 120

# Full Godot editor/runtime control. The pinned binary is preinstalled during
# environment preparation so the server can start with task network disabled.
[mcp_servers.godot]
enabled = true
command = "godot-mcp"
args = []
env = { GODOT_HOST = "127.0.0.1", GODOT_PORT = "6550", GODOT_MCP_USAGE_LOG = "0" }
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 120

# Keep OpenAI product/API documentation current when work touches Codex,
# plugins, MCP, or OpenAI platform integration.
[mcp_servers.openai_docs]
enabled = true
url = "https://developers.openai.com/mcp"
default_tools_approval_mode = "approve"
