# Project-level Codex configuration.
# Loaded only when this repository is trusted by the local/remote Codex host.
#
# Default autonomy profile for this dedicated project workspace:
# - keep the agent sandboxed to the repository/workspace;
# - let it handle routine edits/tests without stopping BK every few seconds;
# - send eligible approval requests to Codex auto-review instead of the user;
# - allow network access from inside the workspace sandbox for Git/MCP/dev tooling.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[sandbox_workspace_write]
network_access = true

# Semantic code navigation/editing. Serena is installed by bootstrap_codespace.sh.
# It uses .serena/project.yml and Godot's built-in GDScript LSP.
[mcp_servers.serena]
enabled = true
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=codex"]
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

# Lightweight GDScript diagnostics + DAP console. This complements the runtime
# editor bridge below and can remain useful when the full bridge is unavailable.
[mcp_servers.godot_diagnostics]
enabled = true
command = "npx"
args = ["-y", "@ryanmazzolini/minimal-godot-mcp@0.1.6"]
env = { GODOT_WORKSPACE_PATH = "client", GODOT_LSP_PORT = "6008", GODOT_DAP_PORT = "6006" }
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 120

# Full Godot editor/runtime control.
[mcp_servers.godot]
enabled = true
command = "npx"
args = ["-y", "@satelliteoflove/godot-mcp@4.1.11"]
env = { GODOT_HOST = "127.0.0.1", GODOT_PORT = "6550", GODOT_MCP_USAGE_LOG = "0" }
# Let Codex use MCP tool annotations + the project auto-review policy instead of
# forcing a manual approval on every Godot state-changing tool call.
default_tools_approval_mode = "auto"
startup_timeout_sec = 30
tool_timeout_sec = 120
# Intentionally not marked required: Codex must still start if the virtual
# Godot editor is temporarily offline. Tool calls will report the bridge issue.

# Keep OpenAI product/API documentation current when work touches Codex,
# plugins, MCP, or OpenAI platform integration.
[mcp_servers.openai_docs]
enabled = true
url = "https://developers.openai.com/mcp"
default_tools_approval_mode = "approve"
